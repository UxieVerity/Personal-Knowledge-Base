<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Dialog 阻止背景滚动：四种方案实测</title>
<style>
  body{font:14px/1.7 system-ui,sans-serif;padding:0;margin:0;background:#0f1115;color:#e8ecf4}
  .page{max-width:820px;margin:0 auto;padding:24px}
  h1{font-size:20px} h2{font-size:15px;margin:18px 0 8px;color:#9fc5ff}
  .scroll-body{height:1400px;background:repeating-linear-gradient(180deg,#171a21 0 80px,#1a1e28 80px 160px);border-radius:8px;padding:20px;margin-bottom:16px}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  button{padding:8px 14px;cursor:pointer;background:#232936;border:1px solid #3a4152;color:#e8ecf4;border-radius:6px;font-size:13px}
  button:hover{background:#2c3342}
  button.active{background:#3d4f66;border-color:#5a7ba6}
  pre{background:#0b0d12;border:1px solid #2a2f3a;border-radius:8px;padding:14px;font-size:12.5px;min-height:200px;overflow:auto;line-height:1.7;white-space:pre-wrap}
  .green{color:#7bed9f}.yellow{color:#ff9f43}.red{color:#ff6b81}.blue{color:#4db6ff}
  .modal{display:none;position:fixed;inset:0;z-index:1000}
  .modal.on{display:block}
  .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
  .modalbox{position:relative;max-width:360px;margin:8vh auto 0;background:#1c2130;border:1px solid #3a4152;border-radius:10px;padding:20px}
  .modalbox .scroll{max-height:180px;overflow:auto;border:1px solid #2a2f3a;border-radius:6px;padding:8px;margin:10px 0}
  .modalbox .scroll div{height:44px;color:#8b93a7;border-bottom:1px solid #232936}
  #status{font-size:12.5px;color:#8b93a7;margin:8px 0}
</style>
</head>
<body>
<div class="page">
<h1>Dialog 阻止背景滚动 —— 方案实测</h1>
<p id="status">下面四张卡分别对应一种方案。滚动页面到中部再打开弹窗，然后滚弹窗内部 / 在弹窗外滚动，观察背景是否跟着滚。</p>

<div class="btns">
  <button id="b-html" class="active">方案0 · &lt;dialog&gt; 原生</button>
  <button id="b-overflow">方案1 · body overflow:hidden</button>
  <button id="b-overscroll">方案2 · overscroll-behavior:contain</button>
  <button id="b-touch">方案3 · touchmove preventDefault</button>
</div>

<div class="btns">
  <button id="b-open">▶ 打开弹窗</button>
  <button id="b-close">✕ 关闭弹窗</button>
  <button id="b-jump">↺ 跳回页面中部</button>
</div>

<div class="scroll-body">
  <div style="color:#8b93a7">背景滚动区域 · 往下滚再打开弹窗测试</div>
  <div style="height:600px"></div>
  <div style="color:#ff9f43" id="midmark">【页面中部标记】</div>
  <div style="height:600px"></div>
</div>

<pre id="log">（操作日志）</pre>

<!-- 原生 dialog -->
<dialog id="dlg-html">
  <h3>原生 &lt;dialog&gt;（showModal）</h3>
  <p>用 <b>showModal()</b> 打开。滚动下方列表测试背景。</p>
  <div class="scroll"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>
  <button id="dlg-close1">关闭</button>
</dialog>

<!-- 自定义 modal -->
<div class="modal" id="modal">
  <div class="backdrop"></div>
  <div class="modalbox">
    <h3 id="modal-title">方案</h3>
    <p>滚动下方列表测试背景是否穿透。</p>
    <div class="scroll" id="modal-inner"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div></div>
    <button id="modal-close">关闭</button>
  </div>
</div>

<script>
const logEl = document.getElementById('log');
const log = s => logEl.textContent = s.replace(/<[^>]+>/g,'') + '\n' + logEl.textContent;
const midmark = document.getElementById('midmark');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalInner = document.getElementById('modal-inner');
const dlg = document.getElementById('dlg-html');

let scheme = 'html';  // html | overflow | overscroll | touch
let scrollYBefore = 0;
const body = document.body;

function setScheme(s){
  scheme = s;
  document.querySelectorAll('.btns button').forEach(b=>b.classList.remove('active'));
  document.getElementById('b-'+s).classList.add('active');
  log(`方案设为 ${s}`);
}

function openModal(){
  scrollYBefore = window.scrollY;
  if (scheme === 'html'){
    // 原生 dialog
    if (typeof dlg.showModal === 'function') dlg.showModal();
    else { log('浏览器不支持 dialog.showModal'); return; }
    modalTitle.textContent = '方案0 · 原生 <dialog>';
  } else {
    modalTitle.textContent = {overflow:'方案1 · body overflow:hidden', overscroll:'方案2 · overscroll-behavior:contain', touch:'方案3 · touchmove preventDefault'}[scheme];
    modal.classList.add('on');
  }

  // ---- 按方案应用锁 ----
  if (scheme === 'overflow'){
    body.style.overflow = 'hidden';
    body.style.position = 'fixed';
    body.style.width = '100%';
    body.style.top = -scrollYBefore + 'px';
    log('已应用: body {overflow:hidden; position:fixed; top:-'+scrollYBefore+'px}');
  } else if (scheme === 'overscroll'){
    // Chrome 144+ 可在 dialog 及 backdrop 上 overscroll-behavior:contain
    modal.style.overscrollBehavior = 'contain';
    log('已应用: modal {overscroll-behavior:contain}（Chrome 144+ 推荐）');
  } else if (scheme === 'touch'){
    document.addEventListener('touchmove', lockTouch, {passive:false});
    log('已应用: document touchmove preventDefault（passive:false）');
  }
}

function lockTouch(e){
  // 允许弹窗内部滚动
  if (modalInner.contains(e.target)) return;
  e.preventDefault();
}

function closeModal(){
  if (scheme === 'html'){
    dlg.close();
  } else {
    modal.classList.remove('on');
  }
  // 还原
  if (scheme === 'overflow'){
    body.style.overflow = '';
    body.style.position = '';
    body.style.width = '';
    body.style.top = '';
    window.scrollTo(0, scrollYBefore);
  }
  if (scheme === 'touch'){
    document.removeEventListener('touchmove', lockTouch, {passive:false});
  }
  log('已关闭，滚动位置还原');
}

// 按钮
document.getElementById('b-html').onclick = ()=>{ if(modal.classList.contains('on'))closeModal(); setScheme('html'); };
document.getElementById('b-overflow').onclick = ()=>{ if(modal.classList.contains('on'))closeModal(); setScheme('overflow'); };
document.getElementById('b-overscroll').onclick = ()=>{ if(modal.classList.contains('on'))closeModal(); setScheme('overscroll'); };
document.getElementById('b-touch').onclick = ()=>{ if(modal.classList.contains('on'))closeModal(); setScheme('touch'); };
document.getElementById('b-open').onclick = openModal;
document.getElementById('b-close').onclick = closeModal;
document.getElementById('b-jump').onclick = ()=>{ midmark.scrollIntoView({block:'center'}); log('已跳到页面中部 scrollY='+window.scrollY); };
document.getElementById('dlg-close1').onclick = ()=>dlg.close();
document.getElementById('modal-close').onclick = closeModal;

log('已就绪。建议：先滚到页面中部 → 选方案 → 打开弹窗 → 滚弹窗内部/外部测试。');
</script>
</body>
</html>
