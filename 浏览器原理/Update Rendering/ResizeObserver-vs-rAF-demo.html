<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ResizeObserver vs requestAnimationFrame 执行顺序</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#2a2f3a;
    --raf:#ff9f43; --ro:#4db6ff; --muted:#8b93a7; --text:#e8ecf4;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font:14px/1.6 system-ui,"Segoe UI",sans-serif; padding:24px; max-width:880px; margin:0 auto; }
  h1{ font-size:20px; margin-bottom:4px; }
  .sub{ color:var(--muted); margin-bottom:16px; }
  .controls{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center; }
  button{ background:#232936; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; }
  button:hover{ background:#2c3342; }
  button.active{ background:#3d4f66; border-color:#5a7ba6; }
  .stats{ font-size:13px; color:var(--muted); margin-left:auto; white-space:nowrap; }
  .stage{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:14px; }
  #box{ width:100px; height:48px; border-radius:8px;
        background:linear-gradient(135deg,#4db6ff,#7c4dff);
        display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600;
        transition:none; }
  .boxlabel{ color:var(--muted); font-size:12px; margin-top:8px; }
  .legend{ display:flex; gap:18px; margin:0 0 12px; font-size:12px; color:var(--muted); }
  .dot{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .dot.raf{background:var(--raf);} .dot.ro{background:var(--ro);}
  #log{ background:#0b0d12; border:1px solid var(--line); border-radius:10px; padding:12px;
        height:360px; overflow-y:auto; font:12px/1.7 ui-monospace,Consolas,monospace; }
  .logline{ white-space:pre; }
  .raf{ color:var(--raf); }
  .ro{ color:var(--ro); }
  .sys{ color:var(--muted); font-style:italic; }
  #widthLabel{ font-weight:700; }
</style>
</head>
<body>
  <h1>ResizeObserver vs requestAnimationFrame —— 同一帧内谁先执行？</h1>
  <div class="sub">每帧自动改变 #box 宽度（每帧都变 → RO 每帧都触发），日志里可见二者在同一帧内的交错顺序。</div>

  <div class="controls">
    <button id="btnPause">⏸ 暂停</button>
    <button id="btnPlus">+50px</button>
    <button id="btnMinus">-50px</button>
    <button id="btnLoop" title="在 RO 回调里再次修改自身尺寸，观察自反馈">🔄 RO回调改尺寸</button>
    <button id="btnClear">🗑 清空日志</button>
    <span class="stats" id="stats">统计…</span>
  </div>

  <div class="stage">
    <div id="box"><span id="widthLabel">100</span></div>
    <div class="boxlabel">被观察元素 #box —— RO 上报的是 contentRect.width（不含 border/padding），本例等于 CSS width</div>
  </div>

  <div class="legend">
    <span><span class="dot raf"></span>requestAnimationFrame 回调</span>
    <span><span class="dot ro"></span>ResizeObserver 回调</span>
  </div>

  <div id="log"></div>

<script>
(function(){
  const box  = document.getElementById('box');
  const logEl = document.getElementById('log');
  const widthLabel = document.getElementById('widthLabel');
  const statsEl = document.getElementById('stats');
  const btnPause = document.getElementById('btnPause');
  const btnPlus  = document.getElementById('btnPlus');
  const btnMinus = document.getElementById('btnMinus');
  const btnLoop  = document.getElementById('btnLoop');
  const btnClear = document.getElementById('btnClear');

  let frame = 0, running = true, rafId = null, loopMode = false;
  let roFiredSinceLastRaf = false;   // 距上次 rAF 之后 RO 是否已触发过
  let statRoFirst = 0, statNoRo = 0, statFrames = 0;

  function log(cls, text){
    const line = document.createElement('div');
    line.className = 'logline ' + cls;
    line.textContent = '[' + performance.now().toFixed(2).padStart(9) + 'ms] ' + text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setWidth(w){ box.style.width = w + 'px'; widthLabel.textContent = w; }
  function updateStats(){
    statsEl.innerHTML = `RO 先于 rAF 执行: <b style="color:var(--ro)">${statRoFirst}</b> 次 · 该帧无尺寸变化(RO 不触发): ${statNoRo} 次 · 共 ${statFrames} 帧`;
  }

  const ro = new ResizeObserver(entries => {
    const w = entries[0].contentRect.width;
    roFiredSinceLastRaf = true;
    // 此刻 frame = 已经执行完的 rAF 数量,所以下一次要跑的是 rAF#frame+1
    log('ro', `[RO] rAF#${frame} 改的宽度已生效 → 在 rAF#${frame + 1} 之前送达: ${w.toFixed(1)}px`);
    if (loopMode) setWidth(w + 3);   // 故意在回调里改尺寸 → 下一帧会再次触发 RO
  });
  ro.observe(box);

  function tick(){
    statFrames++;
    if (roFiredSinceLastRaf) statRoFirst++; else statNoRo++;
    roFiredSinceLastRaf = false;
    frame++;
    const w = 100 + Math.round(60 * Math.sin(frame / 8));   // 每帧都变 → RO 每帧触发
    setWidth(w);
    log('raf', `[rAF] #${frame}: 设置宽度 = ${w}px`);
    updateStats();
    if (running) rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);

  btnPause.onclick = () => {
    running = !running;
    if (running){ rafId = requestAnimationFrame(tick); }
    else { cancelAnimationFrame(rafId); rafId = null; }
    btnPause.textContent = running ? '⏸ 暂停' : '▶ 继续';
    log('sys', running ? '—— 继续 ——' : '—— 已暂停 (rAF 循环停, RO 不再触发) ——');
  };
  btnPlus.onclick  = () => { const w = parseFloat(box.style.width || 100) + 50; setWidth(w); log('sys', `手动 +50px → 宽度 ${w}px (下一个帧开始时 RO 会上报)`); };
  btnMinus.onclick = () => { const w = Math.max(20, parseFloat(box.style.width || 100) - 50); setWidth(w); log('sys', `手动 -50px → 宽度 ${w}px`); };
  btnLoop.onclick = () => {
    loopMode = !loopMode;
    btnLoop.classList.toggle('active', loopMode);
    if (loopMode){
      running = false; cancelAnimationFrame(rafId); rafId = null; btnPause.textContent = '▶ 继续';
      log('sys', '【实验2】RO 回调里每次 +3px 修改自身尺寸(同时暂停 rAF)。注意: 没有 rAF,RO 却持续触发 → 自反馈循环');
    } else {
      log('sys', '【实验2】关闭 RO 自反馈, 恢复 rAF 循环');
      running = true; btnPause.textContent = '⏸ 暂停'; rafId = requestAnimationFrame(tick);
    }
  };
  btnClear.onclick = () => { logEl.innerHTML = ''; };
})();
</script>
</body>
</html>
